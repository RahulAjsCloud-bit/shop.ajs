
name: Deploy Sandbox to Staging

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-sandbox-to-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Promote Sandbox to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge sandbox into staging
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin sandbox staging
          git checkout -B staging origin/staging

          git merge --no-edit origin/sandbox

          git push origin HEAD:staging

          echo "SUCCESS: Sandbox promoted to staging!"
